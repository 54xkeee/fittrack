    .box{stroke:#7a7f8a;stroke-width:2;rx:22}.h{font:700 26px 'Microsoft YaHei',sans-serif;fill:#1b1b20}.t{font:18px 'Microsoft YaHei',sans-serif;fill:#4d5058}.s{font:16px 'Microsoft YaHei',sans-serif;fill:#5d6070}.arrow{stroke:#1967d2;stroke-width:4;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1967d2"/></marker></defs>
